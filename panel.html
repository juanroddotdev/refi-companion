<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Refi Companion</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-cockpit">
        <div class="top-row">
          <div class="brand-lockup">
            <div class="mode-switch" role="group" aria-label="View mode">
              <button
                id="mode-live"
                class="mode-btn"
                type="button"
                data-mode="live"
                aria-pressed="true"
                title="Live Call Mode: Sparse glanceable cues (Alt+M)"
              >
                <span class="live-pulse" aria-hidden="true"></span>
                Live
              </button>
              <button
                id="mode-practice"
                class="mode-btn"
                type="button"
                data-mode="practice"
                aria-pressed="false"
                title="Practice Mode: Full verbatim scripts & checklists (Alt+M)"
              >
                Practice
              </button>
            </div>
          </div>
          <div class="controls" role="group" aria-label="Call controls">
            <button
              id="quick-objection-toggle"
              class="ghost-button"
              type="button"
              aria-expanded="false"
              aria-controls="quick-objection-drawer"
              title="Quick Objections (Alt+O)"
            >
              Objections
            </button>
            <button
              id="new-call"
              class="secondary-button"
              type="button"
              title="Reset call notes & checklist"
            >
              New
            </button>
            <button
              id="copy-notes"
              class="primary-button"
              type="button"
              title="Copy formatted CRM note (Cmd/Ctrl+Shift+C)"
            >
              Copy CRM
            </button>
          </div>
        </div>

        <div id="live-metrics-strip" class="metrics-strip" aria-live="polite"></div>

        <nav id="step-list" class="step-rail" aria-label="Script steps"></nav>
      </header>

      <section
        id="quick-objection-drawer"
        class="quick-drawer"
        hidden
        aria-label="Instant Objection Handler"
      ></section>

      <p id="step-status" class="visually-hidden" aria-live="polite"></p>

      <section id="step-detail" class="step-detail"></section>

      <section id="notes-dock" class="notes-panel" aria-labelledby="notes-title">
        <div class="notes-header">
          <div class="notes-title-group">
            <h2 id="notes-title">Scratchpad</h2>
            <span id="copy-status" class="copy-status" role="status"></span>
          </div>
          <button
            id="toggle-notes"
            class="notes-collapse-btn"
            type="button"
            aria-expanded="true"
            title="Collapse or expand scratchpad"
          >
            Hide
          </button>
        </div>

        <div id="notes-body" class="notes-body">
          <div class="notes-tabs" role="tablist" aria-label="Note categories">
            <button
              type="button"
              class="note-tab"
              role="tab"
              data-note-tab="goal"
              aria-selected="true"
            >
              Goal &amp; Story
            </button>
            <button
              type="button"
              class="note-tab"
              role="tab"
              data-note-tab="loan"
              aria-selected="false"
            >
              Loan Notes
            </button>
            <button
              type="button"
              class="note-tab"
              role="tab"
              data-note-tab="next"
              aria-selected="false"
            >
              Next Step
            </button>
          </div>

          <div class="note-panes">
            <label class="note-pane" data-note-pane="goal">
              <span class="visually-hidden">Borrower goal</span>
              <textarea
                id="goal-note"
                rows="2"
                placeholder="Motivation, cash-out purpose, why now, cost of waiting..."
              ></textarea>
            </label>
            <label class="note-pane" data-note-pane="loan" hidden>
              <span class="visually-hidden">Loan details</span>
              <textarea
                id="loan-note"
                rows="2"
                placeholder="Escrows, LTV/value estimate, FICO, income/assets notes..."
              ></textarea>
            </label>
            <label class="note-pane" data-note-pane="next" hidden>
              <span class="visually-hidden">Objections / next step</span>
              <textarea
                id="next-note"
                rows="2"
                placeholder="Spouse name, docs needed, follow-up date/time, lock status..."
              ></textarea>
            </label>
          </div>
        </div>
      </section>
    </main>

    <script src="panel.js" type="module"></script>
  </body>
</html>
