<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Refi Companion</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-cockpit">
        <div class="top-row">
          <div class="brand-lockup">
            <div class="mode-switch" role="group" aria-label="View mode">
              <button
                id="mode-live"
                class="mode-btn"
                type="button"
                data-mode="live"
                aria-pressed="true"
                title="Live Call Mode: Fast glanceable cues (Alt+M)"
              >
                <span class="live-pulse" aria-hidden="true"></span>
                Live
              </button>
              <button
                id="mode-practice"
                class="mode-btn"
                type="button"
                data-mode="practice"
                aria-pressed="false"
                title="Practice Mode: Full verbatim Gravity Lending script (Alt+M)"
              >
                Practice
              </button>
            </div>
          </div>
          <div class="controls" role="group" aria-label="Call controls">
            <button
              id="quick-objection-toggle"
              class="ghost-button"
              type="button"
              aria-expanded="false"
              aria-controls="quick-objection-drawer"
              title="Quick Objections (Alt+O)"
            >
              Objections
            </button>
            <button
              id="new-call"
              class="secondary-button"
              type="button"
              title="Reset call checks & scratchpad"
            >
              New
            </button>
            <button
              id="copy-notes"
              class="primary-button"
              type="button"
              title="Copy conversation notes (Cmd/Ctrl+Shift+C)"
            >
              Copy Notes
            </button>
          </div>
        </div>

        <nav id="step-list" class="step-rail" aria-label="Script steps"></nav>
      </header>

      <section
        id="quick-objection-drawer"
        class="quick-drawer"
        hidden
        aria-label="Instant Objection Handler"
      ></section>

      <p id="step-status" class="visually-hidden" aria-live="polite"></p>

      <section id="step-detail" class="step-detail"></section>

      <section id="notes-dock" class="notes-panel" aria-labelledby="notes-title">
        <div class="notes-header">
          <div class="notes-title-group">
            <h2 id="notes-title">Call Scratchpad</h2>
            <span id="copy-status" class="copy-status" role="status"></span>
          </div>
          <button
            id="toggle-notes"
            class="notes-collapse-btn"
            type="button"
            aria-expanded="true"
            title="Collapse or expand scratchpad"
          >
            Hide
          </button>
        </div>

        <div id="notes-body" class="notes-body">
          <label class="note-pane">
            <span class="visually-hidden">Call scratchpad notes</span>
            <textarea
              id="call-note"
              rows="3"
              placeholder="Goal, payment comfort, keep vs trade, warranty, objections / next step..."
            ></textarea>
          </label>
        </div>
      </section>
    </main>

    <script src="panel.js" type="module"></script>
  </body>
</html>
